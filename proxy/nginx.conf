server {
    listen 80;
    server_name _;

    # API requests go to the backend server. proxy_pass has no URI part, so the
    # full original path (e.g. /api/site-config) is forwarded unchanged. The
    # Express app mounts its routers under VHOST_PREFIX=/api.
    location /api/ {
        proxy_pass http://server:4500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the static SPA served by the client container.
    location / {
        proxy_pass http://client:4501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / upgrade passthrough (harmless for the static server).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
