services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: shelly-user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shelly_db
    # Host port publishing lives in docker-compose.dev.yml so production keeps
    # the database internal-only (avoids clashing with other services on the
    # prod host). Containers still reach it over the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelly-user -d shelly_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    # Host port published only in dev (see docker-compose.dev.yml).
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    # Host port published only in dev (see docker-compose.dev.yml).
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: registry.caldane.net/shelly-host-server:latest
    container_name: shelly-server
    environment:
      PORT: "$PORT"
      MQTT_URL: "$MQTT_URL"    
      CLIENT_URL: "$CLIENT_URL"
      SHELLY_CLOUD_AUTH_KEY: "$SHELLY_CLOUD_AUTH_KEY"
      VHOST_PREFIX: "$VHOST_PREFIX"
      LOG_MODE: "${LOG_MODE:-normal}"
      DATABASE_URL: "postgres://shelly-user:${DB_PASSWORD}@postgres:5432/shelly_db"
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "4500:4500"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: runtime
      args:
        VITE_APP_BACKEND: "$VITE_APP_BACKEND"
        VITE_APP_NAME: "$VITE_APP_NAME"
    image: registry.caldane.net/shelly-host-client:latest
    container_name: shelly-client
    environment:
      VITE_APP_BACKEND: "$VITE_APP_BACKEND"
      VITE_APP_NAME: "$VITE_APP_NAME"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    ports:
      - "4501:4501"

volumes:
  postgres_data:
  loki_data: