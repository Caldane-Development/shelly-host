name: NetCheck
on:
  workflow_dispatch:
jobs:
  chk:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Probe proxy from runner (external host)
        run: |
          echo "runner host: $(hostname) $(hostname -I 2>/dev/null)"
          echo -n "runner -> 10.10.10.28:4501 / -> "; curl -s -o /dev/null -w "%{http_code}\n" --connect-timeout 5 http://10.10.10.28:4501/ || echo "CURL_FAIL"
          echo -n "runner -> 10.10.10.28:4501 /api/mqtt-broker -> "; curl -s -o /dev/null -w "%{http_code}\n" --connect-timeout 5 http://10.10.10.28:4501/api/mqtt-broker || echo "CURL_FAIL"
          echo -n "runner -> 10.10.10.28:4500/health -> "; curl -s -o /dev/null -w "%{http_code}\n" --connect-timeout 5 http://10.10.10.28:4500/health || echo "CURL_FAIL"
          echo -n "tcp connect 10.10.10.28:4501: "; timeout 5 bash -c "echo >/dev/tcp/10.10.10.28/4501" 2>/dev/null && echo OPEN || echo REFUSED
