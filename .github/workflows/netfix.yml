name: NetFix

# Temporary one-off: recreate the shelly-host stack on the prod host (10.10.10.28)
# so its compose network picks up the new 10.89.0.0/24 subnet, freeing the bad
# 192.168.0.0/20 that was swallowing the real 192.168.1.0/24 LAN. Delete after use.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Recreate shelly-host stack on prod host + verify
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/github_runner_key github-runner@10.10.10.28 'set -e; cd /home/github-runner/shelly-host; echo "=== BEFORE: route to 192.168.1.15 ==="; ip route get 192.168.1.15 2>&1 || true; echo "=== compose down ==="; docker compose -f docker-compose.yml -f docker-compose.prod.yml down </dev/null 2>&1; echo "=== compose up ==="; docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans </dev/null >up.log 2>&1 || { cat up.log; exit 1; }; cat up.log; echo "=== shelly-host_default subnet ==="; docker network inspect shelly-host_default | grep -o "\"Subnet\": \"[^\"]*\""; echo "=== AFTER: route to 192.168.1.15 ==="; ip route get 192.168.1.15 2>&1; echo -n "ping 192.168.1.15: "; ping -c1 -W2 192.168.1.15 >/dev/null 2>&1 && echo OK || echo FAIL; echo -n "ping 192.168.1.1: "; ping -c1 -W2 192.168.1.1 >/dev/null 2>&1 && echo OK || echo FAIL; echo -n "mqtt 192.168.1.15:1884: "; timeout 3 bash -c "echo >/dev/tcp/192.168.1.15/1884" 2>/dev/null && echo OPEN || echo UNREACHABLE; echo "=== ps ==="; docker compose -f docker-compose.yml -f docker-compose.prod.yml ps'
