name: NetFix

# Temporary one-off: tear down the shelly-host stack on the prod host (10.10.10.28)
# so its bad 192.168.0.0/20 compose network is removed (it was swallowing the real
# 192.168.1.0/24 LAN). The stack is brought back up by the normal Deploy workflow,
# which recreates the network with the new 10.89.0.0/24 subnet. Delete after use.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Tear down prod stack + verify LAN route restored
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/github_runner_key github-runner@10.10.10.28 'set -e; cd /home/github-runner/shelly-host; echo "=== BEFORE: route to 192.168.1.15 ==="; ip route get 192.168.1.15 2>&1 || true; echo "=== compose down ==="; docker compose -f docker-compose.yml -f docker-compose.prod.yml down </dev/null 2>&1; echo "=== network gone? ==="; docker network ls | grep shelly-host || echo "shelly-host network removed"; echo "=== AFTER: route to 192.168.1.15 ==="; ip route get 192.168.1.15 2>&1; echo -n "ping 192.168.1.15: "; ping -c1 -W2 192.168.1.15 >/dev/null 2>&1 && echo OK || echo FAIL; echo -n "ping 192.168.1.1: "; ping -c1 -W2 192.168.1.1 >/dev/null 2>&1 && echo OK || echo FAIL'
