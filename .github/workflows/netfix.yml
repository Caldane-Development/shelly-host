name: NetFix

# Temporary one-off: tear down the shelly-host stack on the prod host (10.10.10.28)
# so its bad 192.168.0.0/20 compose network is removed (it was swallowing the real
# 192.168.1.0/24 LAN). The stack is brought back up by the normal Deploy workflow,
# which recreates the network with the new 10.89.0.0/24 subnet. Delete after use.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Verify new subnet + LAN reachability
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/github_runner_key github-runner@10.10.10.28 'cd /home/github-runner/shelly-host; echo "=== shelly-host_default subnet ==="; docker network inspect shelly-host_default | grep -o "\"Subnet\": \"[^\"]*\""; echo "=== route get 192.168.1.15 ==="; ip route get 192.168.1.15 2>&1; echo -n "ping 192.168.1.15: "; ping -c1 -W2 192.168.1.15 >/dev/null 2>&1 && echo OK || echo FAIL; echo -n "ping 192.168.1.1: "; ping -c1 -W2 192.168.1.1 >/dev/null 2>&1 && echo OK || echo FAIL; echo -n "mqtt 192.168.1.15:1884: "; timeout 3 bash -c "echo >/dev/tcp/192.168.1.15/1884" 2>/dev/null && echo OPEN || echo UNREACHABLE; echo -n "ping 10.10.10.1 (own gw): "; ping -c1 -W2 10.10.10.1 >/dev/null 2>&1 && echo OK || echo FAIL; echo "=== ps ==="; docker compose -f docker-compose.yml -f docker-compose.prod.yml ps'
