name: NetDiag

# Temporary one-off diagnostic run ON the prod host (self-hosted runner lives on
# 10.10.10.29 and SSHes to the prod host 10.10.10.28 where the stacks run).
# Read-only. Delete after use.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Runner host
        run: |
          echo "HOST=$(hostname)"
          ip -4 addr show | grep -E "inet " | grep -v 127.0.0.1
          echo -n "runner -> 192.168.1.15: "; ping -c1 -W2 192.168.1.15 >/dev/null 2>&1 && echo OK || echo FAIL

      - name: Prod host (10.10.10.28)
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/github_runner_key github-runner@10.10.10.28 'echo "HOST=$(hostname)"; echo "=== interfaces ==="; ip -4 -o addr show | awk "{print \$2, \$4}"; echo "=== docker network subnets ==="; for n in $(docker network ls --format "{{.Name}}"); do echo -n "$n: "; docker network inspect "$n" | grep -o "\"Subnet\": \"[^\"]*\"" | tr "\n" " "; echo; done; echo "=== nets overlapping 192.168.1 ==="; for n in $(docker network ls --format "{{.Name}}"); do docker network inspect "$n" | grep -o "\"Subnet\": \"[^\"]*\"" | grep -q "192.168.1" && echo "OVERLAP in network: $n"; done; echo "(overlap scan done)"; echo "=== routes ==="; ip route; echo "=== route get 192.168.1.15 ==="; ip route get 192.168.1.15 2>&1; echo -n "ping 192.168.1.15: "; ping -c1 -W2 192.168.1.15 >/dev/null 2>&1 && echo OK || echo FAIL; echo -n "ping 192.168.1.1: "; ping -c1 -W2 192.168.1.1 >/dev/null 2>&1 && echo OK || echo FAIL; echo -n "mqtt 192.168.1.15:1884: "; timeout 3 bash -c "echo >/dev/tcp/192.168.1.15/1884" 2>/dev/null && echo OPEN || echo UNREACHABLE'
