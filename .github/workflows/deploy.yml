name: Deploy

# Runs only after CI succeeds on main (cross-workflow gate), or manually.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; queue instead of cancelling a
# deploy that is mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: registry.caldane.net
  SERVER_IMAGE: registry.caldane.net/shelly-host-server
  CLIENT_IMAGE: registry.caldane.net/shelly-host-client

jobs:
  build-and-push:
    name: Build & push images
    # Skip when triggered by a failed/cancelled CI run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        name: Compute image tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          # Use the host's existing Docker/BuildKit builder instead of spinning
          # up a docker-container builder, which the hardened runner blocks
          # (sysctl net.ipv4.ip_unprivileged_port_start permission denied).
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          target: runtime
          push: true
          build-args: |
            VITE_APP_BACKEND=${{ vars.VITE_APP_BACKEND }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Ship the compose files so the prod host stays in sync with the repo.
      - name: Copy compose files to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: ${{ secrets.PROD_DEPLOY_PATH }}

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: IMAGE_TAG,REGISTRY_USERNAME,REGISTRY_PASSWORD,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$REGISTRY_PASSWORD" | docker login registry.caldane.net -u "$REGISTRY_USERNAME" --password-stdin
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
