name: Deploy

# Runs only after CI succeeds on main (cross-workflow gate), or manually.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; queue instead of cancelling a
# deploy that is mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Local registry running on the prod host (same pattern as
  # Soonercon/programming-survey). Push via the host's LAN address, pull via
  # localhost -- both point at the same registry:2 on the box, so no public
  # network hop and no registry credentials are needed.
  PUSH_REGISTRY: 10.10.10.28:5000
  SERVER_IMAGE: 10.10.10.28:5000/shelly-host-server
  CLIENT_IMAGE: 10.10.10.28:5000/shelly-host-client

jobs:
  deploy:
    name: Build, push & deploy
    # The self-hosted runner lives on the production host, so it builds, pushes
    # to the local registry, and brings the stack up locally.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        name: Compute image tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build & push server image
        run: |
          docker build \
            -t "$SERVER_IMAGE:latest" \
            -t "$SERVER_IMAGE:${{ steps.meta.outputs.tag }}" \
            -f server/Dockerfile .
          docker push "$SERVER_IMAGE:latest"
          docker push "$SERVER_IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Build & push client image
        run: |
          docker build \
            --target runtime \
            --build-arg VITE_APP_BACKEND="${{ vars.VITE_APP_BACKEND }}" \
            --build-arg VITE_APP_NAME="${{ vars.VITE_APP_NAME }}" \
            -t "$CLIENT_IMAGE:latest" \
            -t "$CLIENT_IMAGE:${{ steps.meta.outputs.tag }}" \
            -f client/Dockerfile .
          docker push "$CLIENT_IMAGE:latest"
          docker push "$CLIENT_IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Deploy stack
        # PROD_DEPLOY_PATH holds the production compose files + runtime .env on
        # the host. Copy the repo's compose files there, then bring the stack up
        # with the freshly built, tagged images.
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          cp docker-compose.yml docker-compose.prod.yml "$DEPLOY_PATH"/
          cd "$DEPLOY_PATH"
          export IMAGE_TAG
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
