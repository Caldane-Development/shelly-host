name: Deploy

# Runs only after CI succeeds on main (cross-workflow gate), or manually.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; queue instead of cancelling a
# deploy that is mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Local registry running on the prod host (same pattern as
  # Soonercon/programming-survey). Push via the host's LAN address, pull via
  # localhost -- both point at the same registry:2 on the box, so no public
  # network hop and no registry credentials are needed.
  PUSH_REGISTRY: 10.10.10.28:5000
  SERVER_IMAGE: 10.10.10.28:5000/shelly-host-server
  CLIENT_IMAGE: 10.10.10.28:5000/shelly-host-client

jobs:
  deploy:
    name: Build, push & deploy
    # The self-hosted runner lives on the production host, so it builds, pushes
    # to the local registry, and brings the stack up locally.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        name: Compute image tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build & push server image
        run: |
          docker build \
            -t "$SERVER_IMAGE:latest" \
            -t "$SERVER_IMAGE:${{ steps.meta.outputs.tag }}" \
            -f server/Dockerfile .
          docker push "$SERVER_IMAGE:latest"
          docker push "$SERVER_IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Build & push client image
        run: |
          docker build \
            --target runtime \
            --build-arg VITE_APP_BACKEND="${{ vars.VITE_APP_BACKEND }}" \
            --build-arg VITE_APP_NAME="${{ vars.VITE_APP_NAME }}" \
            -t "$CLIENT_IMAGE:latest" \
            -t "$CLIENT_IMAGE:${{ steps.meta.outputs.tag }}" \
            -f client/Dockerfile .
          docker push "$CLIENT_IMAGE:latest"
          docker push "$CLIENT_IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Deploy stack
        # The runner user (github) can build & push to the local registry, but
        # the stack itself runs under the github-runner account on the prod host
        # (same box, 10.10.10.28). Deploy over SSH like Soonercon/programming-
        # survey: copy the compose files, then pull from localhost:5000 and bring
        # the stack up. Runtime config is injected from GitHub vars/secrets.
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH="ssh -T -o BatchMode=yes -i ~/.ssh/github_runner_key -o StrictHostKeyChecking=no github-runner@10.10.10.28"
          SCP="scp -i ~/.ssh/github_runner_key -o StrictHostKeyChecking=no"

          $SSH "mkdir -p '$DEPLOY_PATH'"
          $SCP docker-compose.yml docker-compose.prod.yml "github-runner@10.10.10.28:$DEPLOY_PATH/"

          $SSH "IMAGE_TAG='$IMAGE_TAG' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<EOF
            set -euo pipefail
            cd "\$DEPLOY_PATH"
            export IMAGE_TAG

            # Runtime configuration (injected from GitHub vars/secrets).
            export PORT="${{ vars.PORT }}"
            export VHOST_PREFIX="${{ vars.VHOST_PREFIX }}"
            export CLIENT_URL="${{ vars.CLIENT_URL }}"
            export VITE_APP_BACKEND="${{ vars.VITE_APP_BACKEND }}"
            export VITE_APP_NAME="${{ vars.VITE_APP_NAME }}"
            export LOG_MODE="${{ vars.LOG_MODE }}"
            export MQTT_URL="${{ secrets.MQTT_URL }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export SHELLY_CLOUD_AUTH_KEY="${{ secrets.SHELLY_CLOUD_AUTH_KEY }}"

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            # Redirect 'up' stdio to a file: with -d the started containers can
            # otherwise inherit this SSH channel's stdout pipe and keep the
            # session open forever even though the stack is already up. Writing
            # to a file (then cat'ing it) lets SSH close cleanly.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans </dev/null >up.log 2>&1 || { cat up.log; exit 1; }
            cat up.log
            # Best-effort cleanup; don't fail the deploy if a prune is already
            # running (e.g. a concurrent/previous run) or nothing to prune.
            docker image prune -f || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          EOF
