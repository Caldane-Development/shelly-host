# Production overlay.
#
# Pulls prebuilt images from the local registry (registry:2 on the prod host)
# instead of building from source, so the production host only needs the compose
# files + a .env (not the full repo).
#
# Images are pushed by CI to 10.10.10.28:5000 and pulled here via localhost:5000
# (same registry, resolved locally on the host).
#
# Usage on the production host:
#   IMAGE_TAG=<git-sha> \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
#
# IMAGE_TAG defaults to "latest" when unset. The deploy workflow sets it to the
# short commit SHA so each release is pinned to an immutable image.
services:
  server:
    image: localhost:5000/shelly-host-server:${IMAGE_TAG:-latest}
    pull_policy: always

  client:
    image: localhost:5000/shelly-host-client:${IMAGE_TAG:-latest}
    pull_policy: always
