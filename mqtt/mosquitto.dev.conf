persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Local dev only: suppress connect/disconnect notices. Mosquitto cannot filter
# logs by source IP, so this silences the healthcheck (mosquitto_pub from
# 127.0.0.1) noise for all clients. Prod uses mosquitto.conf which keeps them.
connection_messages false

listener 1883 0.0.0.0
allow_anonymous true

listener 9001
protocol websockets
